[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowweave"
version = "0.1.0"
description = "Cooperative, congestion-aware file-transfer scheduling system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4.0",
    "cvxpy>=1.6,<2.0",
    "fastapi>=0.115,<1.0",
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "simpy>=4.1,<5.0",
    "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[project.scripts]
flowweave = "flowweave.cli:main"

[tool.setuptools.packages.find]
include = ["flowweave*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
